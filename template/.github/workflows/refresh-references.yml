name: Refresh references

# Weekly rebuild from the official sources; a pull request only when something besides the build date changed.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tools/refresh.sh /tmp/src
      - name: Ignore date-only changes
        run: |
          for f in $(git diff --name-only); do
            if [ -z "$(git diff -U0 "$f" | grep '^[+-]' | grep -v '^+++\|^---' | grep -v 'GENERATED by tools/\|"_generated"')" ]; then
              git checkout -- "$f"
            fi
          done
      - run: python3 -m unittest discover -s tests
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-references
          commit-message: "chore: refresh references"
          title: "chore: refresh references"
          body: "Automated rebuild of the GENERATED references from the official sources."
          delete-branch: true
